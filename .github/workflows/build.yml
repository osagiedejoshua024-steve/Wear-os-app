name: Build Project

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest

    - name: Install dependencies
      run: bun install

    - name: Build web assets
      run: bun run build

    - name: Upload Build Output
      uses: actions/upload-artifact@v4
      with:
        name: dist-build
        path: dist/
        
